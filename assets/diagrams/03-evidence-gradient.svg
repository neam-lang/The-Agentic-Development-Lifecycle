<svg viewBox="0 0 940 452" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Measured effect of AI assistance declines as task realism rises, from +55.8% to -19%."
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

  <!-- plot frame -->
  <line x1="96" y1="46" x2="96" y2="332" stroke="var(--line,#E2E8F0)" stroke-width="1.4"/>
  <line x1="96" y1="332" x2="892" y2="332" stroke="var(--line,#E2E8F0)" stroke-width="1.4"/>

  <!-- gridlines + y labels -->
  <g font-size="11" font-family="ui-monospace, monospace" fill="var(--faint,#94A3B8)">
    <line x1="96" y1="63"  x2="892" y2="63"  stroke="var(--line-soft,#F1F5F9)"/>
    <text x="88" y="67"  text-anchor="end">+56%</text>
    <line x1="96" y1="112" x2="892" y2="112" stroke="var(--line-soft,#F1F5F9)"/>
    <text x="88" y="116" text-anchor="end">+40%</text>
    <line x1="96" y1="156" x2="892" y2="156" stroke="var(--line-soft,#F1F5F9)"/>
    <text x="88" y="160" text-anchor="end">+26%</text>
    <line x1="96" y1="296" x2="892" y2="296" stroke="var(--line-soft,#F1F5F9)"/>
    <text x="88" y="300" text-anchor="end">−19%</text>
  </g>

  <!-- zero line -->
  <line x1="96" y1="237" x2="892" y2="237" stroke="var(--ink,#0F172A)"
        stroke-width="1.6" stroke-dasharray="6 5" opacity=".5"/>
  <text x="88" y="241" text-anchor="end" font-size="11.5" font-weight="700"
        font-family="ui-monospace, monospace" fill="var(--ink,#0F172A)">0</text>

  <!-- trend -->
  <path d="M170 63 C 300 100, 400 150, 620 171 S 740 250, 800 296"
        fill="none" stroke="var(--p1,#BE123C)" stroke-width="2.6" opacity=".28"/>

  <!-- points -->
  <g>
    <!-- Peng +55.8 -->
    <circle cx="170" cy="63" r="8" fill="var(--gA,#047857)"/>
    <text x="170" y="40" text-anchor="middle" font-size="15" font-weight="740" fill="var(--gA,#047857)">+55.8%</text>
    <text x="170" y="88" text-anchor="middle" font-size="11.5" fill="var(--ink-soft,#334155)">Peng et al.</text>
    <text x="170" y="103" text-anchor="middle" font-size="10.5" fill="var(--muted,#64748B)">HTTP server,</text>
    <text x="170" y="116" text-anchor="middle" font-size="10.5" fill="var(--muted,#64748B)">recruited devs</text>

    <!-- Heilman +40 -->
    <circle cx="320" cy="112" r="7" fill="var(--gB,#0E7490)"/>
    <text x="320" y="93" text-anchor="middle" font-size="14" font-weight="720" fill="var(--gB,#0E7490)">~+40%</text>
    <text x="320" y="137" text-anchor="middle" font-size="11.5" fill="var(--ink-soft,#334155)">Heilman et al.</text>
    <text x="320" y="152" text-anchor="middle" font-size="10.5" fill="var(--muted,#64748B)">16,223 engineers,</text>
    <text x="320" y="165" text-anchor="middle" font-size="10.5" fill="var(--muted,#64748B)">heaviest-use weeks</text>

    <!-- Cui +26.08 -->
    <circle cx="470" cy="156" r="8" fill="var(--gA,#047857)"/>
    <text x="470" y="137" text-anchor="middle" font-size="14" font-weight="720" fill="var(--gA,#047857)">+26.08%</text>
    <text x="470" y="181" text-anchor="middle" font-size="11.5" fill="var(--ink-soft,#334155)">Cui et al.</text>
    <text x="470" y="196" text-anchor="middle" font-size="10.5" fill="var(--muted,#64748B)">4,867 devs, 3 RCTs</text>
    <text x="470" y="209" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--p5,#B45309)">SE 10.3%</text>

    <!-- Google +21, hollow = lost significance -->
    <circle cx="620" cy="171" r="8" fill="var(--paper,#FFF)" stroke="var(--gA,#047857)" stroke-width="2.4"/>
    <text x="620" y="152" text-anchor="middle" font-size="14" font-weight="720" fill="var(--gA,#047857)">+21%</text>
    <text x="620" y="196" text-anchor="middle" font-size="11.5" fill="var(--ink-soft,#334155)">Google RCT</text>
    <text x="620" y="211" text-anchor="middle" font-size="10.5" fill="var(--muted,#64748B)">96 engineers,</text>
    <text x="620" y="224" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--p5,#B45309)">loses significance</text>

    <!-- METR -19 -->
    <circle cx="800" cy="296" r="8" fill="var(--p1,#BE123C)"/>
    <text x="800" y="322" text-anchor="middle" font-size="15" font-weight="740" fill="var(--p1,#BE123C)">−19%</text>
    <text x="800" y="277" text-anchor="middle" font-size="11.5" fill="var(--ink-soft,#334155)">METR RCT</text>
    <text x="800" y="262" text-anchor="middle" font-size="10.5" fill="var(--muted,#64748B)">16 devs, own repos,</text>
    <text x="800" y="249" text-anchor="middle" font-size="10.5" fill="var(--muted,#64748B)">5 years' familiarity</text>
  </g>

  <!-- x axis label -->
  <text x="96"  y="356" font-size="11.5" fill="var(--muted,#64748B)">greenfield toy task</text>
  <text x="494" y="356" text-anchor="middle" font-size="11.5" letter-spacing=".06em"
        font-family="ui-monospace, monospace" fill="var(--faint,#94A3B8)">
    ◄──── TASK REALISM · REPOSITORY FAMILIARITY ────►</text>
  <text x="892" y="356" text-anchor="end" font-size="11.5" fill="var(--muted,#64748B)">expert-owned brownfield</text>

  <!-- the finding -->
  <rect x="96" y="374" width="796" height="66" rx="9"
        fill="var(--p1-wash,#FFF1F2)" stroke="var(--p1,#BE123C)" stroke-width="1.5"/>
  <text x="116" y="394" font-size="13" font-weight="700" fill="var(--p1,#BE123C)">
    The two most rigorously controlled studies sit at opposite ends.</text>
  <text x="116" y="410" font-size="12.5" fill="var(--muted,#64748B)">
    Rigour does not determine sign — task selection does. So the question is never</text>
  <text x="116" y="427" font-size="12.5" fill="var(--muted,#64748B)">
    "is there an RCT?" but "whose codebase was it?"</text>
</svg>
